# ERPNext v15 for the smoke test (U22, AC36; plan section 12; decisions D16, D50). Used only by tests/e2e/test_erpnext_smoke.py (mark `erpnext`), which starts it, runs it once and removes
# everything it created. Adapted from the pwd.yml of frappe_docker (MIT): the same services, the same bench commands, with the images pinned by version and digest, every secret from the
# environment (no default), the only published port bound to 127.0.0.1, and no frontend, websocket, scheduler or queue (the REST API of the backend is all the client calls).
#
#   INVOICEFLOW_ERPNEXT_DB_PASSWORD     root password of the MariaDB of the stack
#   INVOICEFLOW_ERPNEXT_ADMIN_PASSWORD  password of the site's Administrator
#   INVOICEFLOW_ERPNEXT_PORT            host port of the backend (127.0.0.1 only)

name: invoiceflow-erpnext

x-erpnext: &erpnext
  image: frappe/erpnext:v15.124.4@sha256:656ccfd15dd98a184f1874f5b3797d31386c3d54a18def64c9594c7588ab55d7
  networks: [erpnext]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:10.6@sha256:f1c56f035ed268a0d7c2c2e06dc879f6319b997cb434cf822a4cfd72a7aa184d
    networks: [erpnext]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      retries: 40
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${INVOICEFLOW_ERPNEXT_DB_PASSWORD:?set INVOICEFLOW_ERPNEXT_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7.2.11-alpine@sha256:1a34bdba051ecd8a58ec8a3cc460acef697a1605e918149cc53d920673c1a0a7
    networks: [erpnext]

  redis-queue:
    image: redis:7.2.11-alpine@sha256:1a34bdba051ecd8a58ec8a3cc460acef697a1605e918149cc53d920673c1a0a7
    networks: [erpnext]

  configurator:
    <<: *erpnext
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *erpnext
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        bench new-site --no-mariadb-socket --admin-password=$$ADMIN_PASSWORD --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --set-default frontend;
    environment:
      ADMIN_PASSWORD: ${INVOICEFLOW_ERPNEXT_ADMIN_PASSWORD:?set INVOICEFLOW_ERPNEXT_ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${INVOICEFLOW_ERPNEXT_DB_PASSWORD:?set INVOICEFLOW_ERPNEXT_DB_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *erpnext
    restart: "no"
    ports:
      - "127.0.0.1:${INVOICEFLOW_ERPNEXT_PORT:-18080}:8000"
    depends_on:
      create-site:
        condition: service_completed_successfully

networks:
  erpnext:

volumes:
  sites:
  logs:
  db-data:
