# Pipeline configuration (plan, section 4). Read by invoiceflow.config.load_config: every key is checked, and an unknown one is refused by name.
# Relative paths are resolved against the project folder ($INVOICEFLOW_HOME), never against the working directory.
# Which keys enter the seal's fingerprint and which do not is declared in invoiceflow/config.py (FINGERPRINT_KEYS, UNSEALED_KEYS).

[source]                                   # D02
cord_dir = "data/raw/cord"
cord_commit = "7f0115a4b758a71d6473b8d085751692da2fef98"
max_shard_bytes = 600000000
max_rows = 1000
max_image_pixels = 16000000                # the biggest image of CORD: 3,024 x 4,224 = 12.8 million
max_gt_depth = 8
arca_spec_path = "data/raw/arca/QRespecificaciones.pdf"
arca_spec_bytes = 91626
arca_spec_sha256 = "a6d0f71e14f282836f07834af76a975dd885386bf972d860878d4b44278deaac"
expected_rows = { train = 800, validation = 100, test = 100 }   # V05: the split sizes of CORD v2

[[source.cord_files]]                      # one per shard; the six of research/s00 (data/raw/cord/manifest.json)
split = "train"
name = "train-00000-of-00004-b4aaeceff1d90ecb.parquet"
bytes = 490224630
sha256 = "da3994eee1bf9bd3c57f0d53a72c3a6812c8696c5ba26245987949ddf73483cc"

[[source.cord_files]]
split = "train"
name = "train-00001-of-00004-7dbbe248962764c5.parquet"
